<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Upkinsey logo</title>
  <desc id="desc">A sleek Upkinsey wordmark with an abstract U-shaped signal mark.</desc>
  <defs>
    <linearGradient id="markGradient" x1="48" y1="24" x2="188" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF"/>
      <stop offset="0.5" stop-color="#6B5CFF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="246" y1="62" x2="705" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <filter id="shadow" x="12" y="8" width="220" height="216" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.14"/>
    </filter>
  </defs>

