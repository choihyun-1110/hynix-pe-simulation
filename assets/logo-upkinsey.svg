    <path d="M69 69V119C69 150.6 88.9 172 116 172C143.1 172 163 150.6 163 119V69" stroke="url(#markGradient)" stroke-width="23" stroke-linecap="round"/>
    <path d="M92 70V118C92 134.2 101.1 144 116 144C130.9 144 140 134.2 140 118V70" stroke="#F1EFFF" stroke-width="13" stroke-linecap="round"/>
    <circle cx="69" cy="69" r="12" fill="#6B5CFF"/>
    <circle cx="163" cy="69" r="12" fill="#14B8A6"/>
    <circle cx="116" cy="172" r="12" fill="#8B7CFF"/>
    <path d="M88 95C108 82 128 82 147 95" stroke="#C4B5FD" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 16"/>
    <path d="M94 116C109 108 124 108 139 116" stroke="#99F6E4" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 13"/>
